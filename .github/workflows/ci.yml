name: Lightweight tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-render.txt
      - name: Install lightweight test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install 'Pillow>=11,<14'
      - name: Compile Python source
        run: python -m compileall -q scripts tests episodes
      - name: Offline unit and alpha codec tests
        run: python -m unittest discover -s tests -v
      - name: Validate vegetable dialogue
        run: python episodes/vegetable_shop/build.py --check-script