name: Vegetable Shop - neural audio and video
on:
  # A dedicated branch enables one deliberate audio test without auto-rendering on main.
  push:
    branches: [render-audio, render-video]
  workflow_dispatch:
    inputs:
      output:
        description: 'Audio only, or full video when three calibrated expression plates and rig.json are committed'
        required: true
        type: choice
        options: [audio, video]
        default: audio
permissions:
  contents: read
concurrency:
  group: vegetable-render-${{ github.ref }}
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Require real expression plates for video
        if: inputs.output == 'video' || github.ref == 'refs/heads/render-video'
        shell: bash
        run: |
          for stem in Scene_Base Scene_Ah_Blink Scene_Oh; do
            test -s "episodes/vegetable_shop/assets/$stem.png" || test -s "episodes/vegetable_shop/assets/$stem.jpg" || { echo "Missing plate: $stem" >&2; exit 1; }
          done
          test -s episodes/vegetable_shop/assets/rig.json || exit 1
      - name: Install FFmpeg and neural audio dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Download verified free Kokoro weights (one-time per runner)
        run: python setup_audio_models.py
      - name: Generate aligned neural voices, subtitles, QA report
        run: python episodes/vegetable_shop/build.py --audio
      - name: Render 30fps HD episode
        if: inputs.output == 'video' || github.ref == 'refs/heads/render-video'
        run: |
          python episodes/vegetable_shop/build.py --render
          python scripts/check_episode.py episodes/vegetable_shop/output/Vegetable_Shop_Neural_2min.mp4
      - name: Upload outputs without committing large media
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vegetable-shop-${{ inputs.output || (github.ref == 'refs/heads/render-video' && 'video') || 'audio' }}-${{ github.run_number }}
          path: episodes/vegetable_shop/output/
          if-no-files-found: warn
          retention-days: 7